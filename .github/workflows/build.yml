on: [push, pull_request, create, workflow_dispatch]

name: Build

# Least-privilege token (2026-11-27). This workflow only reads the repo
# (checkout, build, test), so its GITHUB_TOKEN gets read access to contents
# and nothing else. Without this block the token falls back to the repo's
# default setting, which can be read/write; declaring it here makes the
# workflow safe whatever that setting is. Uploading and downloading
# artifacts and using the Actions cache need no token scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build Test
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: config/
      - name: Cache west modules
        uses: actions/cache@v2
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-v2-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Initialize workspace (west init)
        run: west init -l config
      - name: Update modules (west update)
        run: west update
      - name: Export zephyr CMake package (west zephyr-export)
        run: west zephyr-export
      - name: List modules (west list)
        run: west list
      - name: Build (west build)
        run: west build -s zmk/app -b technikable -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Zaphod .config
        if: ${{ always() }}
        run: cat -n build/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/zephyr/zmk.uf2 technikable.uf2
      - name: Archive
        uses: actions/upload-artifact@v2
        with:
          name: firmware
          path: technikable.uf2
